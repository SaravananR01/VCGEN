{% extends "base.html" %}

{% block title %}
Thank You
{% endblock %}

{% block body %}

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
    .font-cormorant { font-family: 'Cormorant Garamond', serif; }
    .font-dm        { font-family: 'DM Sans', sans-serif; }

    @keyframes float-up {
        0%   { opacity: 0; transform: translateY(24px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .fade-up-1 { animation: float-up 0.6s ease forwards; }
    .fade-up-2 { animation: float-up 0.6s 0.15s ease both; }
    .fade-up-3 { animation: float-up 0.6s 0.3s ease both; }
    .fade-up-4 { animation: float-up 0.6s 0.45s ease both; }

    @keyframes check-draw {
        0%   { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
    }
    .check-path {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: check-draw 0.5s 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .btn-home {
        position: relative;
        overflow: hidden;
        transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
    }
    .btn-home:hover {
        box-shadow: 0 6px 20px rgba(148, 209, 190, 0.45);
        transform: translateY(-1px);
    }
    .btn-home:active { transform: translateY(0); }
    .btn-home::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.5s ease;
    }
    .btn-home:hover::after { transform: translateX(100%); }
</style>

<div class="font-dm relative flex min-h-[calc(100vh-130px)] items-center justify-center
            overflow-hidden bg-[#daf0ee] px-4 py-12">

    <div class="pointer-events-none absolute inset-0 z-0" style="background:
        radial-gradient(circle at 20% 30%, rgba(148,209,190,0.2) 0%, transparent 50%),
        radial-gradient(circle at 80% 75%, rgba(157,181,178,0.14) 0%, transparent 45%);">
    </div>

    <span class="font-cormorant pointer-events-none absolute bottom-[-2rem] right-[-1rem]
                 z-0 select-none text-[18rem] font-light leading-none
                 text-[#94d1be]/[0.06] hidden sm:block">✓</span>

    <div class="relative z-10 w-full max-w-md text-center">

        <div class="fade-up-1 mb-8 flex justify-center">
            <div class="relative flex h-20 w-20 items-center justify-center rounded-full
                        bg-white shadow-lg shadow-[#9db5b2]/25 border border-[#94d1be]/30">
                <div class="absolute inset-0 rounded-full bg-[#94d1be]/10"></div>
                <svg class="h-9 w-9" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="18" cy="18" r="17" stroke="#94d1be" stroke-width="1.5" opacity="0.4"/>
                    <path class="check-path" d="M10 18.5l5.5 5.5 10.5-11"
                          stroke="#94d1be" stroke-width="2.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="h-1 w-full rounded-t-2xl bg-gradient-to-r from-[#daf0ee] via-[#94d1be] to-[#daf0ee] fade-up-1"></div>

        <div class="rounded-b-2xl bg-white px-8 py-10 shadow-xl shadow-[#9db5b2]/20 sm:px-12 sm:py-12">

            <p class="fade-up-2 font-cormorant text-4xl font-light tracking-tight text-[#2e3430] sm:text-5xl">
                Thank you!
            </p>

            <div class="fade-up-3 my-6 flex items-center gap-3">
                <div class="h-px flex-1 bg-[#9db5b2]/25"></div>
                <span class="font-cormorant italic text-sm text-[#9db5b2]">submission received</span>
                <div class="h-px flex-1 bg-[#9db5b2]/25"></div>
            </div>

            <p class="fade-up-3 text-sm font-light leading-relaxed text-[#5a6b63]">
                Your preferences have been recorded. Your instructor will use them to personalise your course schedule.
            </p>

            <a href="/"
               class="fade-up-4 btn-home mt-10 inline-flex items-center gap-2 rounded-xl
                      bg-[#94d1be] px-8 py-3.5 text-sm font-medium
                      uppercase tracking-widest text-white hover:bg-[#7fc5ae] cursor-pointer">
                Go Home
                <span>→</span>
            </a>

        </div>

        <p class="fade-up-4 mt-6 font-cormorant italic text-sm text-[#9db5b2]">
            You may now close this page.
        </p>

    </div>
</div>

{% endblock %}
