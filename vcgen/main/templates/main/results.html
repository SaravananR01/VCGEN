{% extends "base.html" %}

{% block title %}
Results
{% endblock %}
{% block body %}
<div class="flex flex-col  items-center justify-center min-h-screen bg-[#daf0ee]">
    <div class="w-11/12 h-11/12 bg-white p-8 rounded-lg shadow-lg border-2 border-[#94d1be]">
        <div class="flex w-full flex-row justify-between py-4 h-1/6">
            <div class="w-1/2 flex">
                <button type="submit" class="w-1/6 bg-[#94d1be] text-white p-3 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer">Back</button>
            </div>
            
            <div class="w-1/2 flex justify-end">
                <button type="submit" class="w-1/6 bg-[#94d1be] text-white p-3 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer m-1">Edit</button>
                <button type="submit" class="w-1/6 bg-[#94d1be] text-white p-1 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer m-1">View Responses</button>
            </div>
            
        </div>
        
        <h2 class="text-left text-2xl font-semibold text-[#3b413c] mb-6">[Subject Name]</h2>
        <h3 class="text-left text-3xl font-semibold text-[#3b413c] mb-6">Results-</h2>
        <form action="{% url 'signup' %}" method="post">
            {% csrf_token %}
            <div class="mb-4 flex flex-col">
                <div class="w-full flex flex-row m-4">
                    <label for="[skill]" class="block text-[#3b413c] font-medium w-11/12">[skill]</label>
                    <input type="checkbox" id="[skill]" name="[skill]" class="w-1/12 p-3 border border-[#9db5b2] rounded-md">
                </div>
            </div>

            <div class="flex flex-col  items-center justify-center">
                <button type="submit" class="w-1/2 bg-[#94d1be] text-white p-3 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer">Submit</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
