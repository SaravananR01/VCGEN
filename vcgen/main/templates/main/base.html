<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet" />

    {% load static %}
    <link href="{% static 'main/education-svg.svg' %}" rel="icon" />
    <title>{% block title %}VCGEN{% endblock %}</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #daf0ee;
        color: #3b413c;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .cusfont {
        font-family: 'Playfair Display', serif;
        font-optical-sizing: auto;
      }

      #site-header {
        box-shadow: inset 0 3px 0 0 #94d1be, 0 1px 0 0 #c8e6df;
        background-color: #f0faf6;
        position: sticky;
        top: 0;
        z-index: 50;
      }
    </style>
  </head>

  <body>

    <header id="site-header" class="px-4 sm:px-6 lg:px-12">
      <div class="max-w-7xl mx-auto flex items-center justify-between h-14">

        <div
          class="flex items-center gap-2.5 hover:cursor-pointer group"
          onclick="location.href='/';"
        >
          {% load static %}
          <div class="w-8 h-8 rounded-lg bg-[#94d1be] flex items-center justify-center flex-shrink-0 group-hover:bg-[#7ec4af] transition-colors duration-200 shadow-sm">
            <img src="{% static 'main/education-svg.svg' %}" class="h-5 w-5 brightness-0 invert" alt="VCGEN logo" />
          </div>
          <span class="text-lg font-bold text-[#2e3430] cusfont tracking-wide group-hover:text-[#3b9c7e] transition-colors duration-200">
            VCGEN
          </span>
        </div>

        {% if name %}
        <div class="flex items-center gap-3">

          <div class="flex items-center gap-2 bg-[#daf0ee] border border-[#b8ddd4] rounded-full pl-2 pr-4 py-1.5">
            <div class="w-6 h-6 rounded-full bg-[#94d1be] flex items-center justify-center flex-shrink-0">
              {% load static %}
              <img src="{% static 'main/person-svg.svg' %}" class="h-3.5 w-3.5 brightness-0 invert" alt="" />
            </div>
            <span class="text-sm font-medium text-[#2e3430]">{{ name }}</span>
          </div>


          <button
            onclick="location.href='/';"
            class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#5a7d72] bg-[#d4ede6] hover:bg-[#c2e3d8] border border-[#a8d5c8] px-3 py-2 rounded-lg transition-all duration-150 hover:cursor-pointer"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M18 12H9m9 0-3-3m3 3-3 3" />
            </svg>
            Logout
          </button>

        </div>
        {% endif %}

      </div>
    </header>

    {% block body %}
    {% endblock %}

    <footer class="mt-auto bg-[#f0faf6] border-t border-[#c8e6df] px-4 sm:px-6 lg:px-12 py-4">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          {% load static %}
          <div class="w-5 h-5 rounded bg-[#94d1be] flex items-center justify-center">
            <img src="{% static 'main/education-svg.svg' %}" class="h-3 w-3 brightness-0 invert" alt="" />
          </div>
          <span class="text-xs font-semibold text-[#2e3430] cusfont tracking-wide">VCGEN</span>
        </div>
        <p class="text-xs text-[#8ab5a8]">&copy; 2026 VCGEN. All rights reserved.</p>
        <div class="w-20"></div>
      </div>
    </footer>

  </body>
</html>
