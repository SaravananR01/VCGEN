{% extends "base.html" %}

{% block title %}
Day-Wise Plan
{% endblock %}
{% block body %}
<div class="flex flex-col  items-center justify-center min-h-screen bg-[#daf0ee]">
    <div class="w-11/12 bg-white m-2 p-8 rounded-lg shadow-lg border-2 border-[#94d1be] flex flex-col">
        <div class="flex w-full flex-row justify-between py-4 h-1/6">
            <div class="w-1/2 flex">
                <button onclick="location.href = '/results/{{cid}}';" class="w-1/6 bg-[#94d1be] font-bold text-white text-lg p-3 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer">Back</button>
            </div>
            
            <div class="w-1/2 flex justify-end">
                <button onclick="location.href = '/download_dayplan/{{cid}}';" class="w-1/6 bg-[#94d1be] text-white p-1 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer m-1">Download Plan</button>
            </div>
            
        </div>
        
        <h2 class="text-left text-3xl md:text-4xl font-bold cusfont text-[#2f4f4f] mb-4 tracking-wide">
            {{ cname }}
            <span class="text-[#94d1be] font-medium">({{ cid }})</span>
        </h2>

        <h3 class="text-left text-2xl md:text-3xl font-semibold cusfont text-[#3b413c] mb-8 relative">
            <span class="bg-gradient-to-r from-[#94d1be] to-[#bfe3db] bg-clip-text text-transparent">
                Day-Wise Split-Up
            </span>
            <div class="h-[3px] w-64 mt-2 bg-[#94d1be] rounded-full"></div>
        </h3>

        {% for slot in slots %}
        <div class="w-full p-6 md:p-8 rounded-2xl shadow-lg border-2 border-[#94d1be] 
                    bg-gradient-to-br from-[#bfe3db] to-[#9db5b2] text-[#3b413c] 
                    m-3 transition-all duration-300 hover:shadow-xl hover:scale-[1.01]">

            <h1 class="text-2xl md:text-3xl font-semibold cusfont flex flex-wrap items-center gap-3 border-b-2 border-[#94d1be] pb-3 mb-4">
                <span class="text-[#3b413c]">Hour {{ forloop.counter }}:</span>
                <span class="bg-[#94d1be] text-white text-lg md:text-xl font-medium px-4 py-1 rounded-full shadow-sm">
                    {{ slot.mod }}
                </span>
            </h1>

            <div class="text-lg md:text-xl leading-relaxed bg-white p-4 rounded-xl shadow-sm border border-[#94d1be] hover:bg-[#f3faf9] transition duration-300">
                {{ slot.content }}
            </div>
        </div>
        {% endfor %}


    </div>
</div>
{% endblock %}
