{% extends "base.html" %}

{% block title %}
Results
{% endblock %}
{% block body %}
<div class="flex flex-col  items-center justify-center min-h-screen bg-[#daf0ee]">
    <div class="w-11/12 bg-white m-2 p-8 rounded-lg shadow-lg border-2 border-[#94d1be] flex flex-col">
        <div class="flex w-full flex-row justify-between py-4 h-1/6">
            <div class="w-1/2 flex">
                <button onclick="location.href = '/results/{{cid}}';" class="w-1/6 bg-[#94d1be] text-white p-3 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer">Back</button>
            </div>
            
            <div class="w-1/2 flex justify-end">
                <button onclick="" class="w-1/6 bg-[#94d1be] text-white p-1 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer m-1">Download Plan</button>
            </div>
            
        </div>
        
        <h2 class="text-left text-2xl font-semibold text-[#3b413c] mb-6">{{cname}} - {{cid}}</h2>
        <h3 class="text-left text-3xl font-semibold text-[#3b413c] mb-6">Day Wise Split-Up-</h2>

        {% for slot in slots %}
            <div class="w-full p-8 rounded-lg shadow-lg border-2 border-[#94d1be] bg-[#9db5b2] text-xl m-2">
                <h1 class="text-2xl text-left">Hour {{forloop.counter}}. {{slot.mod}}</h1>
                <h1 class="text-xl text-left">{{slot.content}}</h1>
            </div>
        {% endfor %}

    </div>
</div>
{% endblock %}
