{% extends "base.html" %}

{% block title %}
Survey
{% endblock %}
{% block body %}
<div class="flex flex-col  items-center justify-center min-h-screen bg-[#daf0ee]">
    <div class="w-11/12 bg-white p-8 m-12 pb-16 rounded-lg shadow-lg border-2 border-[#94d1be]">

        
        <h2 class="text-left text-2xl font-semibold text-[#3b413c] mb-6">{{cname}} - {{cid}}</h2>
        <h3 class="text-left text-xl font-semibold text-[#3b413c] mb-6">Choose the skills you are interested in-</h2>
        <form action="#" method="post">
            {% csrf_token %}
            <div class="mb-4 flex flex-col">
                {% for skill in skills %}
                <div class="w-full flex flex-row m-4">
                    <label for="value_{{skill}}" class="block text-[#3b413c] font-medium w-11/12">{{skill}}</label>
                    <input type="checkbox" id="value_{{skill}}" name="value_{{skill}}" class="w-1/12 p-3 border border-[#9db5b2] rounded-md">
                </div>
                <hr>
                {% endfor %}
            </div>

            <div class="flex flex-col  items-center justify-center">
                <button type="submit" class="w-1/2 bg-[#94d1be] text-white p-3 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer">Submit</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
