{% extends "base.html" %}

{% block title %}
Join A Class!
{% endblock %}
{% block body %}
<div class="flex flex-col items-center justify-center min-h-screen bg-[#daf0ee]">
    <div class="w-full sm:w-96 bg-white p-8 rounded-lg shadow-lg border-2 border-[#94d1be]">
        
        <h2 class="text-center text-2xl font-semibold text-[#3b413c] mb-6">Join a Class</h2>
        
        <form action="#" method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="code" class="block text-[#3b413c] font-medium">Code</label>
                <input type="text" id="code" name="code" class="w-full p-3 border border-[#9db5b2] rounded-md focus:outline-none focus:ring-2 focus:ring-[#94d1be]" placeholder="Enter The Code" required>
            </div>
            <div class="mb-4">
                <label for="name" class="block text-[#3b413c] font-medium">Name</label>
                <input type="text" id="name" name="name" class="w-full p-3 border border-[#9db5b2] rounded-md focus:outline-none focus:ring-2 focus:ring-[#94d1be]" placeholder="Enter Your Name" required>
            </div>
            <div class="mb-6">
                <label for="regno" class="block text-[#3b413c] font-medium">Registration Number</label>
                <input type="text" id="regno" name="regno" class="w-full p-3 border border-[#9db5b2] rounded-md focus:outline-none focus:ring-2 focus:ring-[#94d1be]" placeholder="Enter Your Registration Number" required>
            </div>
            
            <div>
                <button type="submit" class="w-full bg-[#94d1be] text-white p-3 rounded-md hover:bg-[#9db5b2] transition duration-300 hover:cursor-pointer">Join Class</button>
            </div>
        </form>
        <div class="text-red-500 text-center">{{error}}</div>
    </div>
</div>
{% endblock %}
